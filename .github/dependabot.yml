version: 2
updates:
  # Keeps the SHA-pinned actions current; Dependabot updates the pin and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    groups:
      worker-tooling:
        patterns: ["*"]
