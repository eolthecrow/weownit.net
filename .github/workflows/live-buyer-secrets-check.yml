name: Check LIVE buyer Worker secrets (names only)

# Read-only. Lists the NAMES of secrets on weownit-store-live-checkout and reports
# which required ones are present. Cloudflare never returns secret values.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: payments
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned payments tooling
        run: npm ci
      - name: List secret names and compare with what the buyer Worker needs
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.live-checkout.production.jsonc --format json > names.json
          node -e '
            const names=new Set(JSON.parse(require("fs").readFileSync("names.json","utf8")).map(s=>s.name));
            const required=["STRIPE_LIVE_CHECKOUT_KEY","STRIPE_LIVE_FULFILLMENT_KEY","STRIPE_LIVE_WEBHOOK_SECRET"];
            const optional=["RESEND_RECOVERY_API_KEY"];
            for(const n of required)console.log((names.has(n)?"PRESENT ":"MISSING ")+n);
            for(const n of optional)console.log((names.has(n)?"present ":"absent  ")+n+" (optional; recovery stays off)");
            const extra=[...names].filter(n=>!required.includes(n)&&!optional.includes(n));
            if(extra.length)console.log("other secret names:",extra.join(", "));
            if(required.some(n=>!names.has(n))){console.error("Missing required secret(s).");process.exit(1);}'
