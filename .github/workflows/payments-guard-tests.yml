name: Payments R2 guard tests

on:
  push:
    branches:
      - feature/r2-preventive-limits-20261021
    paths:
      - "payments/**"
      - ".github/workflows/payments-guard-tests.yml"
  pull_request:
    paths:
      - "payments/**"
      - ".github/workflows/payments-guard-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: payments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test isolated payments Worker
        run: npm test
