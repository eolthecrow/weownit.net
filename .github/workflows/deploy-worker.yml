name: Deploy Worker

# Deploys worker/ to Cloudflare after its tests pass. Runs on merges to main
# that touch the Worker, or manually from the Actions tab.
#
# One-time setup by the owner (the token never needs to leave Cloudflare/GitHub):
#   1. Cloudflare → My Profile → API Tokens → Create Token → template
#      "Edit Cloudflare Workers", restricted to this account.
#   2. GitHub → Settings → Secrets and variables → Actions → New repository
#      secret: CLOUDFLARE_API_TOKEN (and CLOUDFLARE_ACCOUNT_ID if the token can
#      see more than one account).
# Until the secret exists this workflow only runs the tests and skips deploy.

on:
  push:
    branches: [main]
    paths:
      - 'worker/src/**'
      - 'worker/scripts/**'
      - 'worker/test/**'
      - 'worker/wrangler.jsonc'
      - 'worker/package-lock.json'
      - 'assets/cve-risk-core.js'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned Worker tooling
        working-directory: worker
        run: npm ci
      - name: Test Worker before deploying
        run: node --test worker/test/*.mjs
      - name: Validate contact configuration
        run: node worker/scripts/check-contact-config.mjs
      - name: Verify destination secret exists before deployment
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --format json | node scripts/check-contact-config.mjs --secrets
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: npx wrangler deploy
      - name: Check deployed contact configuration and CORS without sending email
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node worker/scripts/check-contact-health.mjs
      - name: Explain skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; tests passed but nothing was deployed. See the setup notes at the top of this workflow."
