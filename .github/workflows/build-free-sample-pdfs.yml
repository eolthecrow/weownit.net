name: Build free assessment sample PDFs

on:
  push:
    branches: [main]
    paths:
      - "tools/free_sample_builder.py"
      - "tools/free_sample_*.json"
      - ".github/workflows/build-free-sample-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PDF dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Build EN, RO and FR sample PDFs
        run: python tools/free_sample_builder.py

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/WeOwnIT_Network_Security_Assessment_Sample_EN_2026.pdf
          git add downloads/WeOwnIT_Network_Security_Assessment_Sample_RO_2026.pdf
          git add downloads/WeOwnIT_Network_Security_Assessment_Sample_FR_2026.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Build multilingual network security assessment samples"
            git push
          fi
