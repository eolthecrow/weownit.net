name: Briefing live public smoke
# Read-only public website validation. Does not approve, publish, or scan targets.
on:
  schedule:
    - cron: '5 10 * * 1-5'
      timezone: 'Europe/Bucharest'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify latest published Briefing URLs, RSS and client data
        run: python tools/check_briefing_live.py --attempts 3
      - name: Save public verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-live-smoke
          path: briefing-live-smoke.json
          if-no-files-found: warn
          retention-days: 30
