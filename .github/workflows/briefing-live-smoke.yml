name: Briefing live public smoke
# Read-only public website validation. Does not approve, publish, or scan targets.
on:
  push:
    branches: [main]
    paths:
      - 'content/security-briefing.json'
      - 'briefing.html'
      - 'briefing/**'
      - 'assets/security-briefing-data.js'
      - '.github/workflows/briefing-live-smoke.yml'
  schedule:
    - cron: '5 10 * * 1-5'
      timezone: 'Europe/Bucharest'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Allow GitHub Pages and CDN to propagate on pushes
        if: github.event_name == 'push'
        run: sleep 75
      - name: Verify latest published Briefing URLs, RSS and client data
        run: python tools/check_briefing_live.py --attempts 3
      - name: Save public verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: briefing-live-smoke
          path: briefing-live-smoke.json
          if-no-files-found: warn
          retention-days: 30
