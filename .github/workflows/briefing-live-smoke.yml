name: Briefing live public smoke
# Read-only public website validation. Does not approve, publish, or scan targets.
on:
  push:
    branches: [main]
    paths:
      - 'content/security-briefing.json'
      - 'briefing.html'
      - 'briefing/**'
      - 'assets/security-briefing-data.js'
      - '.github/workflows/briefing-live-smoke.yml'
  schedule:
    - cron: '5 10 * * 1-5'
      timezone: 'Europe/Bucharest'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Allow GitHub Pages and CDN to propagate on pushes
        if: github.event_name == 'push'
        run: sleep 75
      - name: Verify latest published Briefing URLs, RSS and client data
        run: python tools/check_briefing_live.py --attempts 3
      - name: Save public verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: briefing-live-smoke
          path: briefing-live-smoke.json
          if-no-files-found: warn
          retention-days: 30
