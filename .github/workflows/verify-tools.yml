name: Verify local security tools
on:
  pull_request:
  push:
    branches: [main]
    paths: ['assets/**', 'tests/**', 'worker/src/**', 'worker/test/**', 'worker/scripts/**', 'worker/wrangler.jsonc', '*.html', 'briefing/**', 'content/**', 'tools/build_security_briefing.py', 'tools/csp_meta.py', '.github/workflows/verify-tools.yml']
permissions:
  contents: read
concurrency:
  group: security-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test synthetic local workflows and public-data failure handling
        run: node --test tests/*.test.cjs worker/test/*.test.mjs
      - name: Test public snapshot evidence handling
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify generated editorial pages and feeds
        run: python tools/build_security_briefing.py --check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install isolated pinned browser test runtime
        run: npm install --prefix "$RUNNER_TEMP/wit-browser" --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium and operating-system dependencies
        run: node "$RUNNER_TEMP/wit-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Render desktop and phone-sized workflows in EN RO FR
        env:
          WIT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/wit-browser/node_modules/playwright
        run: node tests/browser/change-confidence.smoke.cjs
      - name: Verify direct Tools, local file imports and downloads in EN RO FR
        env:
          WIT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/wit-browser/node_modules/playwright
        run: node tests/browser/direct-tools.smoke.cjs
      - name: Verify Security Briefing, articles and homepage in EN RO FR
        env:
          WIT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/wit-browser/node_modules/playwright
        run: node tests/browser/security-briefing.smoke.cjs
      - name: Load every page with its hash-based script CSP and fail on any violation
        env:
          WIT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/wit-browser/node_modules/playwright
        run: node tests/browser/csp.smoke.cjs
      - name: Verify nine-product Store on desktop and mobile in EN RO FR
        env:
          WIT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/wit-browser/node_modules/playwright
        run: node tests/browser/store-p0.smoke.cjs
      - name: Verify contact success and failure handling in EN RO FR without sending email
        env:
          WIT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/wit-browser/node_modules/playwright
        run: node tests/browser/contact.smoke.cjs
