name: Weekly security briefing candidate research
# Owner-private Sunday editorial intake and weekday publication are handled by
# separate ChatGPT automations. This job only archives unreviewed source titles.
on:
  schedule:
    - cron: '17 16 * * 0'
      timezone: 'Europe/Bucharest'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect unreviewed source titles
        run: python tools/briefing_candidates.py
      - name: Preserve shortlist even on source failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-candidates
          path: briefing-candidates.json
          if-no-files-found: warn
          retention-days: 30
