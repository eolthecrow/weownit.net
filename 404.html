<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a151c">
  <meta name="robots" content="noindex">
  <title>Page not found — Network & Security Consultant</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a151c'/%3E%3Cpath d='M13 17h38v30H13z' fill='none' stroke='%236ce2c7' stroke-width='4'/%3E%3Cpath d='m22 27 10 12 10-12' fill='none' stroke='%23f2f1e8' stroke-width='4'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--bg:#0a151c;--bg2:#0e1d25;--line:#29404a;--line-strong:#507078;--ink:#f2f1e8;--muted:#a6b8ba;--accent:#6ce2c7;--font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0a151c,#0d1e26 65%,#12342f);color:var(--ink);font-family:var(--font);display:grid;place-items:center;padding:1.5rem}
    .card{width:min(760px,100%);border:1px solid var(--line-strong);background:rgba(14,29,37,.84);padding:clamp(2rem,6vw,4.5rem);box-shadow:16px 16px 0 rgba(4,12,15,.4)}
    .brand{display:flex;align-items:center;gap:.75rem;font-weight:750;color:inherit;text-decoration:none}.brand img{width:34px;height:auto}
    .code{font-family:var(--mono);color:var(--accent);font-size:.675rem;letter-spacing:.13em;margin:3rem 0 .8rem}
    h1{font-size:clamp(2.7rem,8.1vw,5.85rem);line-height:.95;letter-spacing:-.07em;margin:0 0 1.2rem}p{max-width:600px;color:var(--muted);font-size:.945rem}
    .links{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:2rem}.links a{color:#06201e;background:var(--accent);border:1px solid var(--accent);padding:.75rem 1rem;text-decoration:none;font-weight:800}.links a.secondary{background:transparent;color:var(--ink);border-color:var(--line-strong)}
    .lang-switch{margin-top:1.5rem}.lang-switch button{border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}.lang-switch button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
  </style>
<link rel="stylesheet" href="/assets/site.css?v=19">
<script src="/assets/i18n.js?v=3"></script>
</head>
<body>
  <main class="card">
    <a class="brand" href="https://weownit.net/"><img src="https://weownit.net/assets/va-symbol.svg?v=2" alt=""><span>Network &amp; Security Consultant</span></a>
    <div class="lang-switch" role="group" aria-label="Language"><button type="button" data-lang="ro">RO</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="fr">FR</button></div>
    <div class="code">404 / ROUTE NOT FOUND</div>
    <h1>Wrong path.<br>Useful way back.</h1>
    <p>The page you requested does not exist or has moved. Return to the resource library, explore the technical toolkit, or open the store.</p>
    <div class="links">
      <a href="https://weownit.net/">Back to resources</a>
      <a class="secondary" href="https://weownit.net/tools.html">Tools</a>
      <a class="secondary" href="https://weownit.net/store.html">Store</a>
    </div>
  </main>
<script>
(()=>{
const copy={"en": ["Page not found", "Network & Security Consultant", "404 / PAGE NOT FOUND", "Wrong path. Useful way back.", "The page you requested does not exist or has moved. Return to the resources, explore the tools, or open the store.", "Back to resources", "Tools", "Store"], "ro": ["Pagina nu a fost găsită", "Network & Security Consultant", "404 / PAGINĂ INEXISTENTĂ", "Înapoi la resurse.", "Pagina solicitată nu există sau a fost mutată. Revino la resurse, explorează instrumentele sau deschide magazinul.", "Înapoi la resurse", "Instrumente", "Magazin"], "fr": ["Page introuvable", "Network & Security Consultant", "404 / PAGE INTROUVABLE", "Retrouvez les ressources.", "La page demandée n’existe pas ou a été déplacée. Retrouvez les ressources, explorez les outils ou ouvrez la boutique.", "Retour aux ressources", "Outils", "Boutique"]};
function apply(lang){
 const t=copy[lang];SiteI18n.setLanguage(lang);
 document.title=t[0]+" — "+t[1];document.querySelector(".brand span").textContent=t[1];
 document.querySelector(".code").textContent=t[2];document.querySelector("h1").textContent=t[3];document.querySelector("main p").textContent=t[4];
 document.querySelectorAll(".links a").forEach((a,i)=>a.textContent=t[i+5]);
 document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
 SiteI18n.syncInternalLanguageLinks(lang);
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>apply(b.dataset.lang)));
SiteI18n.installLanguageNavigation();apply(SiteI18n.getInitialLanguage());
})();
</script></body>
</html>
